<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual Measurement</title>
<script src="profile.js"></script>
<link rel="icon" type="image/png" href="pylon.png">
<link rel="apple-touch-icon" href="pylon.png">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8; --panel: #ffffff; --text: #1b1f24; --muted: #6b7482; --faint: #9aa3b0; --border: #e3e6eb;
    --accent: #2563eb; --a: #c2410c; --b: #0f766e; --win: #15803d; --loss: #b91c1c; --soft: #f0f2f5; --gold: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #8b95a5; --faint: #5d6675; --border: #262c35;
      --accent: #60a5fa; --a: #fb923c; --b: #2dd4bf; --win: #4ade80; --loss: #f87171; --soft: #1e232b; --gold: #fbbf24;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1240px; margin: 0 auto; padding: 18px 16px 48px; }
  button, select, input { font: inherit; color: inherit; }
  select, input[type=number] { padding: 4px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); }
  input[type=number] { width: 64px; }
  .muted { color: var(--muted); }
  .ta { color: var(--a); } .tb { color: var(--b); }
  .W { color: var(--win); } .L { color: var(--loss); }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  [data-tip] { cursor: help; }
  .tipped { border-bottom: 1px dotted var(--faint); }

  /* Header + settings bar */
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { font-size: 19px; margin: 0; display: flex; align-items: center; gap: 8px; }
  h1 img { height: 24px; }
  .nav { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; font-size: 13px; }
  .nav a { padding: 5px 14px; text-decoration: none; color: var(--muted); }
  .nav a:hover { color: var(--text); background: var(--soft); }
  .nav a.on { background: var(--accent); color: #fff; }
  .navs { display: inline-flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .ngrp { display: inline-flex; align-items: center; gap: 6px; }
  .nlbl { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); font-weight: 700; }
  .status { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .btn { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .55; cursor: default; }
  .spin { width: 12px; height: 12px; border: 2px solid var(--faint); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #refreshMsg.err { color: var(--loss); }
  .matchbar { display: flex; align-items: center; gap: 10px 20px; flex-wrap: wrap; font-size: 13px; padding: 10px 14px; }
  .allhist { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .warn { color: var(--loss); font-size: 12px; }
  .gear { margin-left: auto; color: var(--muted); background: none; border: 0; cursor: pointer; }
  .gear:hover { color: var(--text); }
  .settings-body { display: flex; flex-wrap: wrap; gap: 12px 18px; border-top: 1px solid var(--border); padding-top: 12px; width: 100%; }
  .settings-body[hidden] { display: none; }
  .settings-body label.f { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  .checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 18px; width: 100%; }
  .checks fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 3px; }
  .checks legend { font-size: 12px; color: var(--muted); margin-bottom: 3px; padding: 0; }
  .selall { font-size: 11px; border: 1px solid var(--border); background: var(--soft); color: var(--muted); border-radius: 5px; padding: 0 6px; margin-left: 4px; cursor: pointer; }
  .selall:hover { color: var(--text); border-color: var(--accent); }
  .checks label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .checks fieldset:disabled { opacity: .45; }

  /* Layout + sidebar */
  .layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; margin-top: 16px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } aside { position: static !important; max-height: none !important; } }
  aside { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; scrollbar-width: thin; padding: 14px 10px 12px; }
  aside h2 { padding: 0 6px; margin-bottom: 8px; }
  .gitem { display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; padding: 7px 8px; cursor: pointer; }
  .gitem:hover { background: var(--soft); }
  .gitem.on { background: var(--soft); border-color: var(--accent); }
  .gitem .t { font-weight: 600; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 6px; }
  .gitem .t .side { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .gitem .t .side.r { justify-content: flex-end; }
  .gitem .t .at { color: var(--faint); font-weight: 400; font-size: 12px; }
  .gitem .t .rec { font-weight: 400; font-size: 11px; color: var(--faint); }
  .gitem .t .slogo { margin: 0; }
  .gitem .sub { font-size: 12px; color: var(--muted); text-align: center; margin-top: 2px; }
  .gitem .fs { font-variant-numeric: tabular-nums; } .gitem .side:not(.won) .fs { color: var(--muted); font-weight: 500; }
  .weeknav { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
  .weeknav h2 { margin: 0 !important; flex: 1; text-align: center; }
  .weeknav button { border: 1px solid var(--border); background: var(--soft); color: var(--text); border-radius: 6px; padding: 1px 8px; cursor: pointer; }
  .weeknav button:disabled { opacity: .35; cursor: default; }
  .wkrec { margin-left: 4px; color: var(--win); text-transform: none; letter-spacing: 0; }
  .scorecard { background: var(--soft); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; font-size: 13px; cursor: help; }
  .scorecard .sc-t { font-weight: 700; margin-bottom: 4px; }
  .scorecard .sc-row { display: grid; grid-template-columns: 1fr auto 44px; gap: 8px; } .scorecard .sc-row b { font-variant-numeric: tabular-nums; } .scorecard .sc-row span:last-child { text-align: right; }
  .favpick { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 0 2px 10px; }
  .favpick span { font-weight: 650; white-space: nowrap; } .favpick select { flex: 1; min-width: 0; }
  .gitem { position: relative; } .gitem .favstar { position: absolute; top: 4px; right: 6px; font-size: 10px; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 7px; border-radius: 999px; border: 1px solid var(--border); margin: 0 2px; }
  .pill.good { color: #fff; background: var(--win); border-color: var(--win); }
  .pill.bad { color: #fff; background: var(--loss); border-color: var(--loss); }
  .pill.push { color: var(--muted); }
  /* a finished game: just the scoreboard and what Virtual Measurement predicted */
  body.pastview #strip, body.pastview #board, body.pastview #counters { display: none; }
  /* 📋 box score of a finished game */
  .bx-team { width: 100%; max-width: 560px; margin: 0 auto 14px; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .bx-team td { padding: 4px 8px; border-bottom: 1px solid var(--border); }
  .bx-team td:first-child { text-align: right; font-weight: 700; } .bx-team td:last-child { text-align: left; font-weight: 700; }
  .bx-team td:nth-child(2) { text-align: center; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
  .bx-team td.better { color: var(--win); }
  .bx-team th { font-size: 13px; padding: 4px 8px; } .bx-team th:first-child { text-align: right; } .bx-team th:last-child { text-align: left; }
  .bx-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
  @media (max-width: 900px) { .bx-grid { grid-template-columns: minmax(0, 1fr); } }
  .bx-side h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-size: 15px; }
  .bx-side h3 img { width: 26px; height: 26px; object-fit: contain; }
  /* player tables use the site's standard stat table (like the career pop-up) */
  .bx-h { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 2px; }
  .bx-side .bx-h:first-of-type { margin-top: 4px; }
  table.bx { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; margin-bottom: 4px; font-size: 13.5px; }
  table.bx th, table.bx td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
  table.bx th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  table.bx td.l, table.bx th.l { text-align: left; }
  table.bx tr:hover td { background: var(--soft); }
  table.bx td.l { max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
  table.bx td .ps { color: var(--muted); font-size: 12px; margin-left: 6px; }
  table.bx a.bx-pl { font-weight: 700; color: inherit; text-decoration: none; } table.bx a.bx-pl:hover { color: var(--accent); text-decoration: underline; }
  .bx-more { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 12px; padding: 2px 8px 6px; }
  .sbt { border-radius: 12px; padding: 8px 12px; }
  .sbt a { color: inherit; text-decoration: none; } .sbt a.lg { line-height: 0; }
  .sbt .who2 { min-width: 0; } .sbt .who2 .full { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sbt .nm .rec2 { font-size: 13px; font-weight: 500; color: var(--faint); }
  .sbt .sc.proj { font-style: italic; }
  .sbm .fin.proj { color: var(--accent); }
  .strip .closelink { cursor: pointer; border-bottom: 1px dotted var(--faint); }
  .scoreboard2 { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 14px; padding: 6px 0 4px; }
  .sbt { display: flex; align-items: center; gap: 12px; } .sbt.r { flex-direction: row-reverse; text-align: right; }
  .sbt img { height: 56px; width: 56px; object-fit: contain; }
  .sbt .nm { font-size: 26px; font-weight: 800; line-height: 1; } .sbt .full { font-size: 12px; color: var(--muted); } .sbt .rec2 { font-size: 12px; color: var(--faint); }
  .sbt .sc { font-size: 52px; font-weight: 850; font-variant-numeric: tabular-nums; margin-left: auto; line-height: 1; color: var(--muted); }
  .sbt.r .sc { margin-left: 0; margin-right: auto; }
  .sbt.win .sc { color: var(--text); }
  .sbm { text-align: center; }
  .sbm .fin { font-size: 13px; font-weight: 800; letter-spacing: .12em; }
  .sbm .wk, .sbm .ln { font-size: 12px; color: var(--muted); }
  .sbm button { margin-top: 6px; font-size: 12px; border: 1px solid var(--border); background: var(--soft); color: var(--text); border-radius: 6px; padding: 2px 10px; cursor: pointer; }
  .vmcard { border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); background: color-mix(in srgb, var(--accent) 6%, transparent); border-radius: 12px; padding: 10px 14px; max-width: 620px; margin: 0 auto; }
  .vmcard .vm-h { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin-bottom: 6px; text-align: center; }
  .vm-row { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 5px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .vm-row:first-of-type { border-top: 0; }
  .vm-conf { text-align: center; font-size: 12px; margin: -2px 0 6px; } .vm-conf.low { color: var(--muted); } .vm-conf.high { color: var(--win); }
  .vm-row .vm-k { font-size: 12px; color: var(--muted); } .vm-row .vm-v small { color: var(--muted); font-size: 12px; }
  .vm-row .pill { font-size: 12px; padding: 1px 10px; }
  .verdict { text-align: center; font-size: 13px; margin-top: 8px; padding: 6px 10px; border-radius: 8px; background: var(--soft); }
  .won { font-weight: 800; }
  .custom { display: flex; gap: 6px; align-items: center; font-size: 13px; padding: 12px 6px 0; border-top: 1px solid var(--border); margin-top: 8px; }
  .custom select { flex: 1; }

  /* Matchup header */
  .hero { display: grid; grid-template-columns: 1fr auto 1fr; gap: 18px; align-items: stretch; }
  .team .name { font-size: 30px; font-weight: 750; line-height: 1.1; display: flex; align-items: center; gap: 8px; }
  .team.right .name { justify-content: flex-end; }
  .team .name .logo { height: 40px; width: 40px; object-fit: contain; }
  .team .full { font-size: 13px; font-weight: 600; margin-top: 2px; }
  .slogo { height: 16px; width: 16px; object-fit: contain; vertical-align: -3px; margin: 0 3px 0 0; }
  .mlogo { height: 26px; width: 26px; object-fit: contain; vertical-align: -6px; margin-right: 4px; }
  .team .name a { color: inherit; text-decoration: none; border-bottom: 2px dotted currentColor; }
  .team .name a.lg { border: 0; line-height: 0; }
  .team { border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; }
  .team .closest { margin-top: auto; } /* sits at the bottom so both cards line up */
  .team > :nth-last-child(2) { margin-bottom: 10px; }
  .team .rec { font-size: 15px; color: var(--muted); font-weight: 500; margin: 0 6px; }
  .team .who { font-size: 13px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Schedule lines: always three rows so both cards stay level */
  .sched { margin-top: 8px; font-size: 13px; display: grid; gap: 2px; }
  .sched div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sched .k { color: var(--muted); }
  .sched .hard { color: var(--loss); font-weight: 600; } .sched .easy { color: var(--win); font-weight: 600; }
  .team.right { text-align: right; } .team.right .tags { justify-content: flex-end; }
  .closest { margin-top: 10px; font-size: 13px; background: var(--soft); border-radius: 8px; padding: 8px 10px; cursor: pointer;
    display: block; width: 100%; text-align: center; margin-top: auto; }
  .closest .tags { justify-content: center !important; }
  .closest:hover { outline: 1px solid var(--accent); }
  .closest .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; display: block; }
  .vegas { text-align: center; width: 180px; } /* fixed so the team cards keep the same width for every game */
  .vegas .at { font-size: 22px; color: var(--faint); }
  .vegas .box { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-top: 6px; font-size: 13px; }
  .vegas .box .k { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .vegas .box .v { font-weight: 650; }
  .vegas .box div + div { margin-top: 4px; }
  .vegas .venue { font-size: 11px; color: var(--faint); margin-top: 6px; }
  @media (max-width: 700px) { .hero { grid-template-columns: 1fr; } .team.right { text-align: left; } .team.right .tags { justify-content: flex-start; } }

  /* Tags */
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .tag { font-size: 12px; padding: 1px 7px; border-radius: 4px; border: 1px solid; white-space: nowrap; }
  .tier-top3    { color: #fff; background: #15803d; border-color: #15803d; }
  .tier-great   { color: var(--win); background: color-mix(in srgb, var(--win) 14%, transparent); border-color: color-mix(in srgb, var(--win) 60%, transparent); }
  .tier-good    { color: var(--win); border-color: color-mix(in srgb, var(--win) 40%, transparent); }
  .tier-avg     { color: var(--muted); border-color: var(--border); }
  .tier-bad     { color: var(--loss); border-color: color-mix(in srgb, var(--loss) 40%, transparent); }
  .tier-bottom3 { color: #fff; background: #b91c1c; border-color: #b91c1c; }
  .tier-style   { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .tier-more    { color: var(--muted); border-color: var(--border); border-style: dashed; }
  .tag.arch { font-weight: 600; color: #7c3aed; border-color: color-mix(in srgb, #7c3aed 50%, transparent); background: color-mix(in srgb, #7c3aed 8%, transparent); }
  @media (prefers-color-scheme: dark) { .tag.arch { color: #c4b5fd; border-color: #8b5cf6; } }
  .tag.ctx-gold { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 60%, transparent); background: color-mix(in srgb, var(--gold) 10%, transparent); font-weight: 600; }
  .tag.ctx-hot { color: #ea580c; border-color: color-mix(in srgb, #ea580c 55%, transparent); }
  .tag.ctx-cold { color: #0284c7; border-color: color-mix(in srgb, #0284c7 55%, transparent); }
  .tag.ctx-info { color: var(--text); border-color: var(--border); background: var(--soft); }
  .tag.ctx-warn { color: var(--loss); border-color: color-mix(in srgb, var(--loss) 45%, transparent); }
  .tag.ctx-plain { color: var(--muted); border-color: var(--border); }
  .tag.take { color: #a855f7; border: 1px dashed color-mix(in srgb, #a855f7 60%, transparent); background: color-mix(in srgb, #a855f7 7%, transparent); font-style: italic; }
  .counters { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); text-align: center; }
  .counters .tags { justify-content: center; }
  .predbox { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
  .pred { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1fr); gap: 0 18px; align-items: center; cursor: help; }
  .pside.l { text-align: right; } .pside.r { text-align: left; }
  .pside .pp { font-size: 30px; font-weight: 850; line-height: 1; font-variant-numeric: tabular-nums; opacity: .55; }
  .pside.lead .pp { opacity: 1; }
  .pside .ps { font-size: 12px; color: var(--muted); }
  .pmid { text-align: center; }
  .pmid .pk { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
  .pbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin: 6px 0; background: var(--soft); }
  .pbar .pa { background: var(--a, var(--accent)); } .pbar .pb { background: var(--b, var(--loss)); }
  .pmid .pd { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .predbox .expander { margin-top: 8px; }
  .strip { display: grid; grid-template-columns: minmax(0, 1fr) 180px minmax(0, 1fr); gap: 0 18px; margin-top: 12px; font-size: 13px; }
  .strip > div { padding: 3px 0; border-top: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip .sl { text-align: right; } .strip .sr { text-align: left; }
  .strip .sm { text-align: center; color: var(--muted); font-size: 12px; cursor: help; }
  .strip .k { color: var(--muted); }
  .strip .hard { color: var(--loss); } .strip .easy { color: var(--win); }
  @media (max-width: 700px) { .strip { grid-template-columns: minmax(0, 1fr) 90px minmax(0, 1fr); gap: 0 8px; } }
  .board { display: grid; grid-template-columns: minmax(0, 1fr) 130px minmax(0, 1fr); gap: 0 12px; margin-top: 14px; border-top: 1px solid var(--border); }
  .board > div { padding: 6px 0; border-bottom: 1px solid var(--border); }
  .board .grp-end { border-bottom-color: color-mix(in srgb, var(--text) 25%, transparent); }
  .board .first { border-bottom-style: dotted; }
  .bcell { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 4px; align-content: center; min-height: 26px; }
  .bcell.l { direction: rtl; } /* mirrored: slot 1 sits next to the middle on both sides */
  .bcell > * { direction: ltr; }
  .bcell .none { grid-column: 1 / -1; text-align: center; }
  .md { overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .md.ghost { opacity: .32; border-style: dashed; filter: grayscale(1); font-weight: 400; font-style: normal; background: none; }
  .md-avg { color: var(--muted); }
  .bcell .none { color: var(--faint); font-size: 12px; }
  .blbl { text-align: center; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; display: flex; flex-direction: column; justify-content: center; }
  .blbl small { font-size: 10px; text-transform: none; letter-spacing: 0; color: var(--faint); font-weight: 400; }
  .md { font-size: 11.5px; line-height: 1.35; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); white-space: nowrap; }
  .md-top3 { background: linear-gradient(135deg, #fde68a, #f59e0b); color: #422006; border-color: #f59e0b; font-weight: 700; }

<script>
const D = window.NFL_DATA;
const { S, TIERS, TIER_KEY, tierIndex, current, lineText } = GLT;
const $ = id => document.getElementById(id);
const GROUPS = { box: 'Scoring & yards per game', epa: 'Efficiency (EPA per play)', more: 'Big plays, sacks & situational', pfr: 'Pass rush (PFR, 2018+)' };
const LOOKALIKES = 20;
// Every stat counts for look-alike matching by default (big plays, sacks and situational too). The ⚙ Settings picks are
// saved to the signed-in profile (VM.pref('stats') / VM.pref('match')), so they follow you to any browser.
const ALL_STATS = S.map(s => s.key);
const savedStats = () => { const v = window.VM?.pref('stats'); return Array.isArray(v) && v.some(k => ALL_STATS.includes(k)) ? v.filter(k => ALL_STATS.includes(k)) : ALL_STATS; };
const selected = new Set(savedStats());
const openGroups = new Set(Object.keys(GROUPS));
// Pass-rush stats are always used where they exist; pre-2018 teams simply don't have them, and the
// comparison skips any stat that either side is missing (those matches are marked ★).
const allHistory = false;
let showGames = false;

const fmtNum = (v, d = 1) => (v === null || v === undefined || isNaN(v) ? '–' : v.toFixed(d));
const signed = (v, d = 1) => (v > 0 ? '+' : '') + fmtNum(v, d);
const fmtStat = (s, v) => (v === null || v === undefined ? '–' : s.pct ? (v * 100).toFixed(1) + '%' : s.fmt === 3 ? signed(v, 3) : fmtNum(v, s.fmt === 2 ? 2 : 1));
const ord = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
const esc = s => String(s).replace(/"/g, '&quot;');
const pct = (a, b) => (b ? Math.round(100 * a / b) : 0);
// ★ for teams from before pass-rush data existed (matched on the other stats only)
const preStar = season => (season < D.pfrFirst ? `<span class="star" data-tip="<b>★ Matched without pass-rush stats</b>Pressure, pressure allowed and blitz rate only exist from ${D.pfrFirst}, so this ${season} team was compared on the other stats.">★</span>` : '');

// ---------- team logos and colors ----------
const logo = (T, cls) => (D.teamInfo?.[T]?.logo ? `<img class="${cls}" src="${D.teamInfo[T].logo}" alt="" loading="lazy" onerror="this.remove()">` : '');
const hexRgb = h => { const n = parseInt(h.trim().slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const lum = rgb => { const [r, g, b] = rgb.map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const contrast = (x, y) => { const [hi, lo] = [lum(x), lum(y)].sort((p, q) => q - p); return (hi + 0.05) / (lo + 0.05); };
const rgbDist = (x, y) => Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]);
// Every team color made readable on the current background (3:1 contrast or better), primary first.
// A color that's too dark (or too light) is blended toward white (or black) until it reads, so navy becomes a
// lighter blue on dark mode and gold becomes a deeper gold on light mode instead of being dropped.
function readableColors(T) {
  const info = D.teamInfo?.[T]; if (!info) return [];
  const bg = hexRgb(getComputedStyle(document.documentElement).getPropertyValue('--panel')), dark = lum(bg) < 0.5;
  return info.colors.filter(c => /^#[0-9a-f]{6}$/i.test(c)).map(hex => {
    const p = hexRgb(hex);
    for (let t = 0; t <= 1; t += 0.05) {
      const c = p.map(v => Math.round(dark ? v + (255 - v) * t : v * (1 - t)));
      if (contrast(c, bg) >= 3) return c;
    }
    return null;
  }).filter(Boolean);
}
function applyTeamColors(A, B) {
  const ca = readableColors(A), cb = readableColors(B), root = document.documentElement.style;
  if (!ca.length || !cb.length) { root.removeProperty('--a'); root.removeProperty('--b'); return; }
  // If both teams' best colors look alike (two red teams, say), use the home team's next readable color
  const b = cb.find(c => rgbDist(c, ca[0]) > 90) || cb[0];
  root.setProperty('--a', `rgb(${ca[0].join(',')})`);
  root.setProperty('--b', `rgb(${b.join(',')})`);
}

// ---------- matching settings ----------
const minSeason = () => GLT.firstSeason;
const activeIdx = () => S.map((s, j) => (selected.has(s.key) && !(allHistory && s.group === 'pfr') ? j : -1)).filter(j => j >= 0);
const settings = () => ({ since: +$('since').value, minGp: +$('minGp').value || 1, venueMatters: $('venue').value === 'home', minSim: +$('minSim').value || 60 });
const findLookalikes = (T, limit) => GLT.findLookalikes(current[T], { idx: activeIdx(), since: settings().since, before: D.currentSeason, limit });

// ---------- tags ----------
// Tier tags from each stat that has a tag definition, always in the same order (the stat list's) so two
// teams' tags line up row for row. A stat with no data yet still gets a placeholder row.
function identityTags(p) {
  return S.map((s, j) => [s, j]).filter(([s]) => s.tag && !(allHistory && s.group === 'pfr')).map(([s, j]) => {
    if (p.ranks[j] === null) return { label: `– ${s.tag.name}`, tip: `<b>${s.tag.name}</b>No data yet.`, cls: 'more' };
    const rank = p.ranks[j], tier = TIERS[tierIndex(rank)], avg = tier.cls === 'avg';
    const label = `${s.tag.descriptive ? tier.style : tier.label} ${s.tag.name}`;
    const tip = `<b>${label}</b>Ranked ${ord(rank)} of 32 in ${s.tag.metric}: ${fmtStat(s, p.avg[j])}` +
      (s.better === 'low' && !s.tag.descriptive ? ' (lower is better).' : '.') +
      (s.tag.descriptive ? '<br><br>Describes style, not quality.' : `<br><br>${TIER_KEY}`);
    return { label, tip, cls: s.tag.descriptive && !avg ? 'style' : tier.cls };
  });
}
const identityHtml = p => identityTags(p).map(t => `<span class="tag tier-${t.cls}" data-tip="${esc(t.tip)}">${t.label}</span>`).join('');
// Invisible filler rows so both teams' boxes have the same number of rows in each section
const pad = n => '<span class="tag pad" aria-hidden="true">&nbsp;</span>'.repeat(Math.max(0, n));
const countTags = html => (html.match(/class="tag /g) || []).length;
function archHtml(p, compareTo = null) {
  const out = GLT.archetypeOutcomes(p.gp);
  const theirs = compareTo ? new Set(GLT.archetypesOf(compareTo).map(a => a.key)) : null;
  return GLT.archetypesOf(p).map(a => {
    const o = out[a.key];
    const tip = `<b>${a.icon} ${a.name}</b>${a.desc}.` + (o.n
      ? `<br><br>Since ${GLT.ARCH_FIRST}, <b>${o.n}</b> teams looked like this after ${Math.max(p.gp, 4)} games:<br>• ${pct(o.playoffs, o.n)}% made the playoffs<br>• ${fmtNum(o.wins / o.n)} wins on average<br>• ${o.sb} won the Super Bowl` +
        (o.examples.length ? `<br><br>Examples: ${o.examples.join(', ')}` : '')
      : '<br><br>No past team fit this at the same point in the season.');
    const shared = theirs && theirs.has(a.key);
    return `<span class="tag arch ${theirs ? (shared ? 'shared' : 'dim') : ''}" data-tip="${esc(tip + (shared ? `<br><br>✓ ${compareTo.team} ${compareTo.season === D.currentSeason ? 'has' : 'had'} this too` : ''))}">${a.icon} ${a.name}</span>`;
  }).join('');
}
// How many archetypes two profiles share (for the look-alike lists)

  const list = [[A, B], [B, A]].flatMap(([x, y]) => GLT.countersOf(current[x], current[y]).map(c => ({ x, y, c, r: rec[c.key] })));
  if (!list.length) return '<span class="muted" style="font-size:13px">⚔ No big unit-vs-unit mismatches in this one.</span>';
  return '<h2 style="margin-bottom:6px">⚔ Matchup counters</h2><div class="tags">' + list.map(({ x, y, c, r }) => {
    const tip = `<b>⚔ ${c.name}</b>${c.desc(x, y)}.<br><br>Since ${GLT.ARCH_FIRST}, teams holding this edge won <b>${r.w} of ${r.w + r.l} (${pct(r.w, r.w + r.l)}%)</b>, by ${signed(r.avgMargin)} points on average.`;
    return `<span class="tag arch" data-tip="${esc(tip)}">${x}: ${c.name} · wins ${pct(r.w, r.w + r.l)}%</span>`;
  }).join('') + '</div>';
}

// ---------- backtest: the pick for every finished game, made only with what was known before kickoff ----------
// Both teams' stats as of the game before (each team's snapshot after its previous game), compared only with past
// seasons, through the same similar-matchups method as the prediction box. Week 1 has no stats yet, so no pick.
// Two reads, blended 20% / 80%:
//  1) similar matchups: past games where both teams looked like these two (who won, their average score)
//  2) points: each offense's points per game against the other defense's points allowed (pulled 30% toward the
//     league average, since a few games run hot), plus home field
// Backtested before kickoff on 806 games from 2023–25: points alone picked 62.7% of winners, history alone 58.8%,
// this blend 62.2%. How alike the past games were didn't predict accuracy, so the weight is fixed. The win chance
// itself is well calibrated (70%+ picks were right ~80% of the time), so confidence comes from it.
const BLEND = { lo: 0, span: 1, min: 0.2, max: 0.2 }; // weight on the similar-matchups read
const LG_PTS = 22.5, PTS_REGRESS = 0.7, HOME_EDGE = 1.5, GAME_SD = 13.4; // GAME_SD: spread of NFL final margins
const PF = S.findIndex(s => s.key === 'pf'), PA = S.findIndex(s => s.key === 'pa');
const phi = z => { const t = 1 / (1 + 0.3275911 * Math.abs(z / Math.SQRT2)), y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-z * z / 2); return z >= 0 ? (1 + y) / 2 : (1 - y) / 2; };
function predict(qa, qb, idx) { // qa = away team's profile, qb = home team's
  const { since, minGp, venueMatters, minSim } = settings();
  const pool = GLT.findMatches(qa, qb, { idx, since, before: D.currentSeason, minGp, topN: 100, venueMatters });
  let list = pool.filter(m => m.pct >= minSim), fallback = false;
  if (list.length < 3) { list = pool.slice(0, 10); fallback = true; } // too few close ones: use the 10 closest
  const n = list.length; if (!n) return null;
  const aW = list.filter(m => m.margin > 0).length, bW = list.filter(m => m.margin < 0).length, ties = n - aW - bW;
  const simA = list.reduce((t, m) => t + m.aPts, 0) / n, simB = list.reduce((t, m) => t + m.bPts, 0) / n, simPa = (aW + ties / 2) / n;
  // the points read
  const reg = v => LG_PTS + PTS_REGRESS * ((v ?? LG_PTS) - LG_PTS);
  const ptsA = (reg(qa.avg[PF]) + reg(qb.avg[PA])) / 2 - HOME_EDGE / 2, ptsB = (reg(qb.avg[PF]) + reg(qa.avg[PA])) / 2 + HOME_EDGE / 2;
  const ptsPa = phi((ptsA - ptsB) / GAME_SD);
  // how much to trust the history: the average likeness of the games used
  const quality = list.reduce((t, m) => t + m.pct, 0) / n, w = Math.max(BLEND.min, Math.min(BLEND.max, (quality - BLEND.lo) / BLEND.span));
  const avgA = w * simA + (1 - w) * ptsA, avgB = w * simB + (1 - w) * ptsB, pa = Math.round(100 * (w * simPa + (1 - w) * ptsPa));
  const top = Math.max(pa, 100 - pa), conf = top >= 70 ? 'high' : top >= 58 ? 'medium' : 'low';
  return { list, fallback, n, aW, bW, ties, avgA, avgB, pa, pb: 100 - pa, simA, simB, simPa, ptsA, ptsB, ptsPa, quality, w, conf };
}
// The picks: the side with the bigger share of similar-matchup wins (typical score breaks a 50/50), and against the
// spread the side the typical score margin beats the line for
function picksOf(pr, away, home, spread) {
  const pick = pr.pa > 50 ? away : pr.pa < 50 ? home : pr.avgA > pr.avgB ? away : pr.avgB > pr.avgA ? home : null; // the blended win chance decides
  const m = pr.avgB - pr.avgA; // typical home margin
  const atsHome = spread === null || spread === undefined || m === spread ? null : m > spread;
  return { pick, atsHome, margin: m };
}
const BT = { done: false, key: '', games: new Map(), week: {}, w: 0, l: 0, aw: 0, al: 0, ap: 0 };
let btTimer = null;
function runBacktest() {
  const idx = activeIdx(), key = JSON.stringify([settings(), idx]);
  if (BT.key === key) return;
  Object.assign(BT, { done: false, key, games: new Map(), week: {}, w: 0, l: 0, aw: 0, al: 0, ap: 0 });
  clearTimeout(btTimer);
  const todo = PAST.filter(g => g.hgp > 0 && g.agp > 0);
  let i = 0;
  const step = () => { // a few games at a time so the page stays responsive
    if (BT.key !== key) return;
    for (const end = Math.min(todo.length, i + 8); i < end; i++) {
      const g = todo[i], pr = idx.length ? predict(GLT.profile(g.season, g.away, g.agp), GLT.profile(g.season, g.home, g.hgp), idx) : null;
      if (!pr) continue;
      const { pick, atsHome } = picksOf(pr, g.away, g.home, g.spread), wk = BT.week[g.week] ||= { n: 0, w: 0, l: 0, aw: 0, al: 0, ap: 0 };
      const winner = g.hs > g.as ? g.home : g.as > g.hs ? g.away : null, entry = { pick, pr };
      if (pick && winner) { const ok = pick === winner; wk.n++; ok ? (wk.w++, BT.w++) : (wk.l++, BT.l++); entry.ok = ok; }
      if (atsHome !== null) {
        const hm = g.hs - g.as, res = hm === g.spread ? 'push' : (hm > g.spread) === atsHome ? 'win' : 'loss';
        entry.ats = { team: atsHome ? g.home : g.away, line: atsHome ? -g.spread : g.spread, result: res };
        res === 'push' ? (wk.ap++, BT.ap++) : res === 'win' ? (wk.aw++, BT.aw++) : (wk.al++, BT.al++);
      }
      BT.games.set(g, entry);
    }
    if (i < todo.length) { btTimer = setTimeout(step, 0); drawScorecard(); return; }
    BT.done = true; renderSidebar($('teamA').value, $('teamB').value);
  };
  btTimer = setTimeout(step, 30);
}
function drawScorecard() {

  $('scorecard').innerHTML = `<div class="sc-t">📈 Virtual Measurement ${D.currentSeason}${BT.done ? '' : ' <span class="muted">(scoring…)</span>'}</div>
    <div class="sc-row"><span>Winners</span><b>${BT.w}-${BT.l}</b><span class="muted">${pc(BT.w, BT.l)}</span></div>
    <div class="sc-row"><span>vs the spread</span><b>${BT.aw}-${BT.al}${BT.ap ? '-' + BT.ap : ''}</b><span class="muted">${pc(BT.aw, BT.al)}</span></div>`;
}

// ---------- 📋 box score of a finished game (real stats from nflverse, app/boxscores.js) ----------
let BOX = null, boxLoading = null; const boxOpen = new Set(); // boxOpen: "team|table" lists showing every player
function loadBox() {
  return (boxLoading ||= new Promise(res => {
    const s = Object.assign(document.createElement('script'), { src: 'boxscores.js' });
    s.onload = () => res((BOX = window.NFL_BOX || null)); s.onerror = () => res(null);
    document.head.appendChild(s);
  }));
}
function renderBox(P) {
  const el = $('boxPanel');
  if (!P) { el.hidden = true; return; }
  el.hidden = false;
  if (!BOX) { el.innerHTML = '<h2>📋 Box score</h2><p class="muted">Loading…</p>'; loadBox().then(() => { if (pastGame === P) renderBox(P); }); return; }
  const id = `${P.season}_${String(P.week).padStart(2, '0')}_${P.away}_${P.home}`, g = BOX.games?.[id];
  if (!g || !g.players[P.away] || !g.players[P.home]) {
    el.innerHTML = `<h2>📋 Box score</h2><p class="muted">Not published yet: nflverse posts a week's player stats a day or two after the games. Try ↻ Refresh data later.</p>`; return;
  }
  const C = BOX.cols, obj = (cols, r) => Object.fromEntries(cols.map((c, i) => [c, r[i]]));
  // team stats, mirrored: the better number of each pair is green
  const T = k => obj(C.team, g.teams[k] || []);
  const ta = T(P.away), tb = T(P.home);
  const trow = (label, a, b, fa = x => x, hi = 1) => { const better = a === b || hi === 0 ? 0 : (a > b) === (hi > 0) ? -1 : 1;
    return `<tr><td class="${better < 0 ? 'better' : ''}">${fa(a, ta)}</td><td>${label}</td><td class="${better > 0 ? 'better' : ''}">${fa(b, tb)}</td></tr>`; };
  const teamTable = `<table class="bx-team"><tr><th class="ta">${P.away}</th><th></th><th class="tb">${P.home}</th></tr>
    ${trow('First downs', ta.fd, tb.fd)}${trow('Total yards', ta.yds, tb.yds)}
    ${trow('Passing', ta.pass, tb.pass, (v, t) => `${v} <span class="muted" style="font-weight:400">(${t.cmp}/${t.att})</span>`)}
    ${trow('Rushing', ta.rush, tb.rush, (v, t) => `${v} <span class="muted" style="font-weight:400">(${t.car} car)</span>`)}
    ${trow('Yards per play', ta.yds / (ta.plays || 1), tb.yds / (tb.plays || 1), v => v.toFixed(1))}
    ${trow('Sacked', ta.sk, tb.sk, (v, t) => `${v}–${t.skyds}`, -1)}${trow('Turnovers', ta.to, tb.to, v => v, -1)}
    ${trow('Penalties', ta.pen, tb.pen, (v, t) => `${v}–${t.penyds}`, -1)}${trow('Plays', ta.plays, tb.plays, v => v, 0)}</table>`;
  // player tables: the top few by default, "show all" for the rest
  const table = (team, key, head, cells, max) => {
    const rows = g.players[team][key] || []; if (!rows.length) return '';
    const all = boxOpen.has(team + '|' + key), shown = all ? rows : rows.slice(0, max);
    return `<h4 class="bx-h">${head[0]}</h4><div class="scroll"><table class="stat bx"><tr><th class="l">Player</th>${head.slice(1).map(h => `<th>${h}</th>`).join('')}</tr>${shown.map(r => `<tr>${cells(obj(C[key], r)).map((c, i) => `<td${i ? '' : ' class="l"'}>${c}</td>`).join('')}</tr>`).join('')}</table></div>
      ${rows.length > max ? `<button class="bx-more" data-bxmore="${team}|${key}">${all ? 'Show fewer' : `Show all ${rows.length}`}</button>` : ''}`;
  };
  // each name opens that player's career stats in a pop-up (on the tab for this table; ctrl-click opens the Players page)
  const nm = (r, pos = true, cat = '') => `${r.id ? `<a class="bx-pl" href="players.html?player=${encodeURIComponent(r.id)}" data-pid="${r.id}" data-cat="${cat}" data-tip="Career stats">${r.name}</a>` : r.name}${pos && r.pos ? `<span class="ps">${r.pos}</span>` : ''}`;
  const avg = (y, n) => (n ? (y / n).toFixed(1) : '–');
  const side = (team, cls) => `<div class="bx-side"><h3>${logo(team, '')}<span class="${cls}">${D.teamInfo?.[team]?.name || team}</span></h3>
    ${table(team, 'pass', ['Passing', 'C/ATT', 'YDS', 'AVG', 'TD', 'INT', 'SCK', 'EPA'], r => [nm(r, false, 'passing'), `${r.cmp}/${r.att}`, r.yds, avg(r.yds, r.att), r.td, r.int, r.sk, r.epa.toFixed(1)], 3)}
    ${table(team, 'rush', ['Rushing', 'CAR', 'YDS', 'AVG', 'TD'], r => [nm(r, true, 'rushing'), r.car, r.yds, avg(r.yds, r.car), r.td], 4)}
    ${table(team, 'rec', ['Receiving', 'REC', 'TGT', 'YDS', 'AVG', 'TD'], r => [nm(r, true, 'receiving'), r.rec, r.tgt, r.yds, avg(r.yds, r.rec), r.td], 5)}
    ${table(team, 'def', ['Defense', 'TKL', 'SCK', 'TFL', 'QBH', 'INT', 'PD', 'FF'], r => [nm(r, true, 'defense'), r.tkl, r.sk || 0, r.tfl, r.qbh, r.int, r.pd, r.ff], 6)}
    ${table(team, 'kick', ['Kicking', 'FG', 'LNG', 'XP'], r => [nm(r, false, 'kicking'), `${r.fgm}/${r.fga}`, r.lng || '–', `${r.xpm}/${r.xpa}`], 2)}
    ${table(team, 'punt', ['Punting', 'NO', 'YDS', 'AVG', 'LNG', 'IN 20'], r => [nm(r, false, 'punting'), r.n, r.yds, avg(r.yds, r.n), r.lng, r.in20], 2)}
    ${table(team, 'ret', ['Returns', 'KR', 'YDS', 'PR', 'YDS', 'TD'], r => [nm(r, false, 'returns'), r.kr, r.kryds, r.pr, r.pryds, r.td], 3)}</div>`;
  el.innerHTML = `<h2>📋 Box score</h2>${teamTable}<div class="bx-grid">${side(P.away, 'ta')}${side(P.home, 'tb')}</div>
    <p class="muted" style="font-size:12px;text-align:center;margin:4px 0 0">Real game stats from nflverse. Passing yards in the team table are net of sacks.</p>`;
}
$('boxPanel').addEventListener('click', e => {
  const pl = e.target.closest('a[data-pid]');
  if (pl && !(e.ctrlKey || e.metaKey || e.shiftKey || e.button)) { e.preventDefault(); window.VMCareer?.open(pl.dataset.pid, { cat: pl.dataset.cat, name: pl.textContent }); return; }
  const b = e.target.closest('[data-bxmore]'); if (!b) return;
  boxOpen.has(b.dataset.bxmore) ? boxOpen.delete(b.dataset.bxmore) : boxOpen.add(b.dataset.bxmore); renderBox(pastGame);
});

// ---------- render ----------
function render() {
  const A = $('teamA').value, B = $('teamB').value, ta = current[A], tb = current[B], idx = activeIdx();
  applyTeamColors(A, B);
  renderSidebar(A, B);
  const game = D.upcoming.find(g => g.away === A && g.home === B);
  if (A !== B) window.VM && VM.add('matchups', `${A}@${B}`); // 🏆 achievements
  if (pastGame) window.VM && VM.unlock('time_traveler');

  // A finished game is shown as of kickoff: the prediction and the stats use both teams' numbers from before the game
  if (pastGame && (pastGame.away !== A || pastGame.home !== B)) pastGame = null;
  const P = pastGame, pg = P && P.agp > 0 && P.hgp > 0 ? P : null;
  const pa0 = pg ? GLT.profile(pg.season, A, pg.agp) : ta, pb0 = pg ? GLT.profile(pg.season, B, pg.hgp) : tb;
  const hist = renderMatchups(A, B, pa0, pb0, idx, P, game);
  // One scoreboard for every game: the final score once it's played, Virtual Measurement's predicted score before that
  const pr = hist?.pr, fmtDay = d => new Date(d + 'T12:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  const line = (spread, home, away) => (spread === null || spread === undefined ? '–' : spread === 0 ? 'PK' : lineText(spread > 0 ? home : away, -Math.abs(spread)));
  const [sa, sb] = P ? [P.as, P.hs] : pr ? [Math.round(pr.avgA), Math.round(pr.avgB)] : ['–', '–'];
  const glow = (right, won) => { // upcoming: the predicted winner glows, stronger the more lopsided the similar matchups were
    if (P || !pr || !won) return '';
    const pct = (right ? pr.pb : pr.pa) / 100, a = Math.max(0.06, 0.1 + 0.6 * (pct - 0.5)).toFixed(2);
    return ` style="background: linear-gradient(${right ? 'to left' : 'to right'}, rgba(34,197,94,${a}), transparent 85%)"`;
  };
  const side = (T, p, pts, won, right) => {
    const c = D.context?.[T] || {};
    return `<div class="sbt ${right ? 'r' : 'l'} ${won ? 'win' : ''}"${glow(right, won)}>
      <a class="lg" href="players.html?team=${T}" data-tip="Open ${T}'s player stats">${logo(T, '')}</a>
      <div class="who2"><div class="nm ${right ? 'tb' : 'ta'}"><a href="players.html?team=${T}">${T}</a> <span class="rec2">${p.rec}</span></div>
        <div class="full">${D.teamInfo?.[T]?.name || ''}</div>${P ? '' : `<div class="full">${c.qb ? `QB ${c.qb}` : ''}${c.coach ? ` · HC ${c.coach}` : ''}</div>`}</div>
      <div class="sc ${P ? '' : 'proj'}">${pts}</div></div>`;
  };
  const aWon = P ? P.as > P.hs : pr && pr.avgA > pr.avgB, bWon = P ? P.hs > P.as : pr && pr.avgB > pr.avgA;
  const mid = P ? `<div class="fin">FINAL</div><div class="wk">Week ${P.week} · ${fmtDay(P.day)}</div><div class="ln">Line: ${line(P.spread, B, A)}</div><button id="backNow">◀ Back to week ${NOW_WEEK}</button>`
    : game ? `<div class="fin proj" data-tip="Virtual Measurement's predicted score: the average score of the similar matchups below">PREDICTED</div><div class="wk">Week ${game.week} · ${fmtDay(game.day)}</div>
        <div class="ln">Line: ${line(game.spread, B, A)}${game.total ? ` · O/U ${game.total}` : ''}</div><div class="wk">${game.stadium || ''}${game.div ? ' · division game' : ''}</div>`
    : (() => { const nx = (D.remaining || []).find(([, h, a]) => h === B && a === A), bye = [A, B].some(t => !D.upcoming.some(u => u.home === t || u.away === t));
        return `<div class="fin proj">PREDICTED</div><div class="wk">${nx ? `Week ${nx[0]} game${bye ? ' (bye this week)' : ''}` : 'Not on this week\'s schedule'}</div>`; })();
  $('hero').innerHTML = `<div class="scoreboard2" style="grid-column:1 / -1">${side(A, pg ? pa0 : ta, sa, aWon, false)}<div class="sbm">${mid}</div>${side(B, pg ? pb0 : tb, sb, bWon, true)}</div>`;
  $('strip').innerHTML = stripHtml(A, B, hist);
  document.body.classList.toggle('pastview', !!P);
  renderBox(P);
  $('tape').closest('.panel').querySelector('h2 .tipped').textContent = pg ? 'Tale of the tape · as of kickoff' : 'Tale of the tape';
  $('board').innerHTML = boardHtml(A, B, ta, tb);
  const [tA, tB] = [pa0, pb0]; // the stats table: as of kickoff for a finished game

  // What each stat measures, for the hover on its name (lower-is-better ones say so)
  const STAT_TIPS = {
    pf: 'Points scored per game.', pa: 'Points allowed per game.', pass: 'Passing yards per game.', rush: 'Rushing yards per game.',
    pass_alw: 'Passing yards allowed per game.', rush_alw: 'Rushing yards allowed per game.',
    to_diff: 'Turnover margin per game: takeaways minus giveaways.',
    pass_epa: 'Expected points added per pass play (sacks included): how much the average dropback helped the offense. Above 0 is better than an average play.',
    rush_epa: 'Expected points added per run: how much the average carry helped the offense. Most teams are below 0; closer to 0 or above is good.',
    def_pass_epa: 'Expected points added that the defense gives up per opponent pass play.', def_rush_epa: 'Expected points added that the defense gives up per opponent run.',
    big_pass: 'Share of dropbacks that turn into completions of 20+ yards.', big_run: 'Share of carries that go for 10+ yards.',
    big_alw: 'Share of opponent plays that become big plays (20+ yard catches or 10+ yard runs).',
    sack_def: 'Sacks per opponent dropback.', sack_off: 'Sacks taken per dropback.',
    cpoe: 'Completion % over expected: how much more often the team’s passes are caught than average passers would manage on the same throws.',
    fd_off: 'First downs gained per play.', fd_def: 'First downs allowed per play.', pen_yds: 'Penalty yards per game.', fg_pct: 'Field goals made per attempt.',
    pressure: 'Share of opponent dropbacks where the defense pressured the QB (hurried, hit or sacked). Pro Football Reference, 2018 on.',
    pressure_alw: 'Share of the team’s own dropbacks where the QB was pressured.',
    blitz: 'Share of opponent dropbacks where the defense sent 5+ rushers. A style, not good or bad.',
  };
  const statTip = s => `<b>${s.label}</b>${STAT_TIPS[s.key] || ''}${s.better === 'low' ? '<br><i>Lower is better.</i>' : ''}`.replace(/"/g, '&quot;');
  // Tale of the tape: every stat, the number colored by its league rank (green = good, red = bad), rank beside it
  const cells = (s, p, j, side, best) => {
    const rank = p.ranks[j], v = fmtStat(s, p.avg[j]);
    const cls = rank === null || rank === undefined ? 'avg' : s.tag?.descriptive ? 'style' : TIERS[tierIndex(rank)].cls;
    const medal = rank === 1 ? '<span data-tip="Ranked 1st in the league">🥇</span>' : rank === 32 ? '<span data-tip="Ranked dead last (32nd) in the league">💩</span>' : '';
    const list = [`<td class="c">${tierChip(s, j, p)}</td>`, `<td class="m">${medal}</td>`, `<td class="k">${rank ? ord(rank) : ''}</td>`, `<td class="n nv-${cls} ${best ? 'best' : ''}">${v}</td>`];
    return (side === 'a' ? list : list.reverse()).join('');
  };
  let lastGroup = null;
  // fixed, mirrored column widths so both sides line up no matter what's in them
  $('tape').innerHTML = '<colgroup><col class="c"><col class="m"><col class="k"><col class="n"><col><col class="n"><col class="k"><col class="m"><col class="c"></colgroup>' + S.map((s, j) => {
    const hidden = (allHistory && s.group === 'pfr') || !openGroups.has(s.group);
    if (hidden && s.group === lastGroup) return '';
    const head = s.group !== lastGroup ? `<tr class="grp" data-group="${s.group}"><td colspan="9">${openGroups.has(s.group) ? '▾' : '▸'} ${GROUPS[s.group]}${allHistory && s.group === 'pfr' ? ' · not used with all history' : ''}</td></tr>` : '';
    lastGroup = s.group;
    if (hidden) return head;
    const ra = tA.ranks[j], rb = tB.ranks[j];
    return head + `<tr class="${idx.includes(j) ? '' : 'off'}">
      ${cells(s, tA, j, 'a', ra < rb)}<td class="stat" data-tip="${statTip(s)}"><span class="tipped">${s.label}</span></td>${cells(s, tB, j, 'b', rb < ra)}</tr>`;
  }).join('');

  $('counters').innerHTML = counterHtml(A, B);
  renderMap();
  runBacktest(); // scores every finished game in the background (skipped when nothing relevant changed)
}

// ---------- the prediction card (similar matchups) — the same card for upcoming and finished games ----------
function renderMatchups(A, B, ta, tb, idx, past = null, game = null) {
  const { since, minSim } = settings();
  const hide = msg => { $('summary').innerHTML = `<p class="muted" style="text-align:center">${msg}</p>`; $('results').innerHTML = ''; $('showGames').hidden = true; $('gamesWrap').hidden = true; return null; };
  if (A === B) return hide('Pick two different teams.');
  if (!idx.length) return hide('Select at least one stat in Settings.');
  if (past && !(past.agp > 0 && past.hgp > 0)) return hide(`No prediction for week ${past.week}: nobody had played a game yet.`);
  const pr = predict(ta, tb, idx); if (!pr) return hide('No similar matchups found.');
  const { list, fallback, n, aW, bW, avgA, avgB, pa, pb } = pr;
  const lead = (x, y) => (x > y ? `${A} by ${fmtNum(x - y, 0)}` : y > x ? `${B} by ${fmtNum(y - x, 0)}` : 'even');
  const spread = past ? past.spread : game?.spread, total = past ? null : game?.total;
  const { pick, atsHome } = picksOf(pr, A, B, spread);
  const pct = pick === A ? pa : pb, atsTeam = atsHome === null ? null : atsHome ? B : A, atsLine = atsHome ? -spread : spread;
  const tt = avgA + avgB, ou = total ? (tt > total ? 'Over' : tt < total ? 'Under' : null) : null;
  // results once the game is played
  let winPill = '', atsPill = '';
  if (past) {
    const winner = past.hs > past.as ? B : past.as > past.hs ? A : null, hm = past.hs - past.as;
    if (pick && winner) winPill = `<span class="pill ${pick === winner ? 'good' : 'bad'}">${pick === winner ? '✓ Right' : '✗ Wrong'}</span>`;
    if (atsHome !== null) { const res = hm === spread ? 'push' : (hm > spread) === atsHome ? 'win' : 'loss'; atsPill = `<span class="pill ${res === 'win' ? 'good' : res === 'loss' ? 'bad' : 'push'}">${res === 'win' ? '✓ Covered' : res === 'loss' ? '✗ Missed' : '– Push'}</span>`; }
  } else { winPill = atsPill = '<span class="pill push">upcoming</span>'; }
  const what = fallback ? `fewer than 3 were ${minSim}%+ alike, so these are the ${n} closest (${list[n - 1].pct}–${list[0].pct}% alike)` : `${n} past games ${minSim}%+ alike since ${since}`;
  const tip = past ? `<b>Picked before kickoff</b>Using only both teams' stats through their previous game, compared with past seasons: ${what}. Nothing from this game or later was used.`
    : `<b>How Virtual Measurement predicts</b>Past games where both teams looked like these two at the same point in their season (${what}). Winner: the side whose look-alikes won more of them. Predicted score: their average score. Spread: the side that average beats the line for. Just for fun.`;
  $('summary').innerHTML = `<div class="vmcard" data-tip="${esc(tip)}">
    <div class="vm-h">🔮 Virtual Measurement ${past ? 'predicted (before kickoff)' : 'predicts'}</div>
    <div class="vm-conf ${pr.conf}" data-tip="${esc(`<b>Confidence: ${pr.conf}</b>The prediction blends two reads. <b>Similar matchups</b> (${n} past games, ${Math.round(pr.quality)}% alike on average): ${A}-like teams went ${aW}-${bW}, average score ${A} ${fmtNum(pr.simA, 0)} – ${fmtNum(pr.simB, 0)} ${B}. <b>Points</b> (each offense's points per game vs the other defense's points allowed, plus home field): ${A} ${fmtNum(pr.ptsA, 0)} – ${fmtNum(pr.ptsB, 0)} ${B}.<br><br>Blended ${Math.round(100 * pr.w)}% history, ${Math.round(100 * (1 - pr.w))}% points (points alone predicted best in a 2023–25 backtest). High = the pick wins 70%+ of the time (those were right about 80% of the time in 2023–25), medium = 58–70%, toss-up = under 58%.`)}">${{ high: '🟢 High confidence', medium: '🟡 Medium confidence', low: '⚪ Toss-up' }[pr.conf]} · <span class="muted">points: ${lead(pr.ptsA, pr.ptsB)} · similar matchups: ${lead(pr.simA, pr.simB)} (${aW}-${bW})</span></div>
    <div class="vm-row"><span class="vm-k">Winner</span><span class="vm-v"><b>${pick || '–'}</b> <small>${pct}% to win</small></span>${winPill}</div>
    <div class="vm-row"><span class="vm-k">Spread</span><span class="vm-v">${atsTeam ? `<b>${atsTeam} ${atsLine === 0 ? 'PK' : (atsLine > 0 ? '+' : '−') + Math.abs(atsLine)}</b>` : '–'} <small>predicted ${A} ${fmtNum(avgA, 0)} – ${fmtNum(avgB, 0)} ${B}</small></span>${atsTeam ? atsPill : ''}</div>
    ${ou ? `<div class="vm-row"><span class="vm-k">Total</span><span class="vm-v"><b>${ou} ${total}</b> <small>predicted total ${fmtNum(tt)}</small></span><span class="pill push">upcoming</span></div>` : ''}</div>`;
  $('showGames').hidden = false; $('showGames').textContent = (showGames ? '▾ Hide' : '▸ Show') + ` the ${n} similar matchups`; $('gamesWrap').hidden = !showGames;
  $('results').innerHTML = matchRows(list, A, B, ta, tb);
  return { aW, bW, n, pr };
}
function matchRows(list, A, B, ta, tb) {
  return `<tr><th>Match</th><th>Game</th><th class="ta" data-tip="Filled purple archetypes are ones the current ${A} also has.">${A}-like</th><th class="tb" data-tip="Filled purple archetypes are ones the current ${B} also has.">${B}-like</th><th class="num">Score</th></tr>` +
    list.map(m => {
      const res = m.margin > 0 ? 'W' : m.margin < 0 ? 'L' : 'T';
      return `<tr><td><span class="sim"><div style="width:${m.pct}%"></div></span><span class="muted">${m.pct}%</span></td>
        <td>${m.season}${preStar(m.season)} <span class="muted">${typeof m.week === 'number' ? 'wk ' + m.week : m.week}</span></td>
        <td>${m.aHome ? '' : '@'}${m.aP.name} <span class="rec">${m.aP.rec}</span><div class="tags">${archHtml(m.aP, ta)}</div></td>
        <td>${m.aHome ? '@' : ''}${m.bP.name} <span class="rec">${m.bP.rec}</span><div class="tags">${archHtml(m.bP, tb)}</div></td>
        <td class="num"><span class="${res}">${res}</span> ${m.aPts}–${m.bPts}</td></tr>`;
    }).join('');
}

// ---------- archetype map ----------
let mapFilter = 'all';
$('archCount').textContent = GLT.ARCHETYPES.length;
function renderMap() {
  if ($('drawer').hidden) return;
  const A = $('teamA').value, B = $('teamB').value;
  const has = T => new Set(GLT.archetypesOf(current[T]).map(a => a.key));
  const hasA = has(A), hasB = has(B);
  const holders = Object.fromEntries(GLT.ARCHETYPES.map(a => [a.key, D.teams.filter(T => GLT.archetypesOf(current[T]).some(x => x.key === a.key))]));
  const gp = Math.max(current[A].gp, 4), out = GLT.archetypeOutcomes(gp);
  const active = GLT.ARCHETYPES.filter(a => holders[a.key].length).length;
  $('mapSub').textContent = `${GLT.ARCHETYPES.length} archetypes · ${active} active across the league right now · ${A} has ${hasA.size}, ${B} has ${hasB.size}`;
  const groups = [...new Set(GLT.ARCHETYPES.map(a => a.group))];
  $('mapBody').innerHTML = groups.map(g => {
    const list = GLT.ARCHETYPES.filter(a => a.group === g).filter(a =>
      mapFilter === 'all' || (mapFilter === 'match' ? hasA.has(a.key) || hasB.has(a.key) : holders[a.key].length));
    if (!list.length) return '';
    return `<h4>${g}</h4>` + list.map(a => {
      const o = out[a.key], who = holders[a.key];
      const tip = `<b>${a.icon} ${a.name}</b>${a.desc}.` + (o.n ? `<br><br>Since ${GLT.ARCH_FIRST}, ${o.n} teams looked like this after ${gp} games: ${pct(o.playoffs, o.n)}% made the playoffs, ${fmtNum(o.wins / o.n)} wins on average, ${o.sb} won the Super Bowl.` + (o.examples.length ? `<br>Examples: ${o.examples.join(', ')}` : '') : '');
      return `<div class="arow ${hasA.has(a.key) || hasB.has(a.key) ? 'hit' : ''}" data-tip="${esc(tip)}">
        <div class="top"><span>${a.icon} ${a.name}</span><span>${hasA.has(a.key) ? `<span class="mark a">${A}</span>` : ''}${hasB.has(a.key) ? `<span class="mark b">${B}</span>` : ''}</span></div>
        <div class="desc">${a.desc}</div>
        <div class="now">${who.length ? `Now: ${who.map(T => logo(T, 'slogo') + T).join(' ')}` : 'No team right now'}${o.n ? ` · history: ${pct(o.playoffs, o.n)}% made playoffs` : ''}</div>
      </div>`;
    }).join('');
  }).join('') || '<p class="muted">Nothing to show for this filter.</p>';
}
$('mapBtn').addEventListener('click', () => { $('drawer').hidden = !$('drawer').hidden; renderMap(); });
$('mapClose').addEventListener('click', () => { $('drawer').hidden = true; });
$('mapFilter').addEventListener('click', e => {
  const f = e.target.closest('button')?.dataset.f; if (!f) return;
  mapFilter = f; document.querySelectorAll('#mapFilter button').forEach(b => b.classList.toggle('on', b.dataset.f === f)); renderMap();
});

// ---------- team look-alikes popup ----------
function openLookalikes(T) {
  const q = current[T];
  $('laTitle').innerHTML = `${logo(T, 'mlogo')}Who does <span class="${T === $('teamA').value ? 'ta' : 'tb'}">${T}</span> look like?`;
  $('laSub').textContent = `${D.currentSeason} ${T} is ${q.rec} after ${q.gp} games. Closest teams since ${settings().since} at the same point in their season. Filled purple archetypes are ones ${T} has right now.`;
  const list = activeIdx().length ? findLookalikes(T, LOOKALIKES) : [];
  const done = list.filter(x => !/In progress/.test(x.h.fin));
  const made = done.filter(x => !/Missed/.test(x.h.fin)).length, wins = done.map(x => +x.h.fin.split('-')[0]);
  $('laSummary').innerHTML = `<div class="tiles">
    <div class="tile"><div class="k">Made the playoffs</div><div class="v">${made} of ${done.length}</div></div>
    <div class="tile"><div class="k">Avg final wins</div><div class="v">${fmtNum(wins.reduce((a, b) => a + b, 0) / (wins.length || 1))}</div></div>
    <div class="tile"><div class="k">Won the Super Bowl</div><div class="v">${done.filter(x => /Won SB/.test(x.h.fin)).length}</div></div></div>`;
  $('laTable').innerHTML = `<tr><th>Match</th><th>Team</th><th>At that point</th><th>Finished</th></tr>` +
    list.map(x => `<tr><td><span class="sim"><div style="width:${x.pct}%"></div></span><span class="muted">${x.pct}%</span></td>
      <td><b>${x.h.season} ${x.h.name}</b>${preStar(x.h.season)} <span class="muted" style="font-size:12px">· ${sharedCount(x.h, q)} shared archetype${sharedCount(x.h, q) === 1 ? '' : 's'}</span><div class="tags">${archHtml(x.h, q)}</div></td><td>${x.h.rec}</td>
      <td>${x.h.fin.replace(' · ', '<br><span class="muted">')}</span></td></tr>`).join('');
  $('overlay').hidden = false;
}
document.addEventListener('click', e => { const b = e.target.closest('.closest[data-team], .closelink[data-team]'); if (b) openLookalikes(b.dataset.team); });
$('laClose').addEventListener('click', () => { $('overlay').hidden = true; });
$('overlay').addEventListener('click', e => { if (e.target === $('overlay')) $('overlay').hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('overlay').hidden = true; $('drawer').hidden = true; } });

// ⭐ Favorite team: the page opens on its game (this week's, or its next one during a bye week). It belongs to the
// signed-in profile; without one, this browser remembers it.
const favOf = () => { const p = window.VM?.profile() ? window.VM.pref('fav') : (() => { try { return localStorage.getItem('vm.fav'); } catch { return ''; } })(); return p && current[p] ? p : ''; };
let FAV = favOf();
$('favTeam').innerHTML = '<option value="">None</option>' + D.teams.slice().sort((a, b) => (D.teamInfo?.[a]?.name || a).localeCompare(D.teamInfo?.[b]?.name || b)).map(t => `<option value="${t}">${D.teamInfo?.[t]?.name || t}</option>`).join('');
$('favTeam').value = FAV;
function favGame(T) {
  const g = D.upcoming.find(x => x.home === T || x.away === T); if (g) return [g.away, g.home];
  const n = (D.remaining || []).filter(([, h, a]) => h === T || a === T).sort((x, y) => x[0] - y[0])[0];
  return n ? [n[2], n[1]] : null;
}
const goToGame = ([a, b]) => { viewWeek = NOW_WEEK; pastGame = null; $('teamA').value = a; $('teamB').value = b; render(); };
$('favTeam').addEventListener('change', () => {
  FAV = $('favTeam').value;
  if (!window.VM?.setPref('fav', FAV)) try { localStorage.setItem('vm.fav', FAV); } catch {}
  if (FAV) window.VM && VM.unlock('fav_team');
  const g = FAV && favGame(FAV); if (g) goToGame(g); else render();
});
// signing in or out (or the profile's settings arriving from the server) brings that profile's ⭐ team and ⚙ Settings
window.addEventListener('vm:prefs', () => {
  const s = savedStats(); selected.clear(); s.forEach(k => selected.add(k)); drawStatChecks(); applyMatchPrefs();
  const f = favOf();
  if (f !== FAV) { FAV = f; $('favTeam').value = FAV; const g = FAV && favGame(FAV); if (g && !pastGame) return goToGame(g); }
  render();
});
document.addEventListener('click', e => {
  if (e.target.id !== 'backNow') return;
  goToGame((FAV && favGame(FAV)) || (D.upcoming.length ? [D.upcoming[0].away, D.upcoming[0].home] : D.teams.slice(0, 2)));
});

// Restore the matchup after a refresh, otherwise start on the favorite team's game, otherwise the first game of the week
const saved = sessionStorage.getItem('matchup')?.split('@');
sessionStorage.removeItem('matchup');
const [startA, startB] = saved && current[saved[0]] && current[saved[1]] ? saved
  : (FAV && favGame(FAV)) || (D.upcoming.length ? [D.upcoming[0].away, D.upcoming[0].home] : D.teams.slice(0, 2));
$('teamA').value = startA; $('teamB').value = startB;
render();
